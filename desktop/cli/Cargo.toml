[package]
name = "strike-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Headless Strike desktop gateway manager"

[[bin]]
name = "strike-desktop"
path = "src/main.rs"

[dependencies]
serde_json = "1"
strike-desktop-core = { path = "../core" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
