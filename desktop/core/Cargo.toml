[package]
name = "strike-desktop-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Loopback gateway manager for the Strike desktop shell"

[dependencies]
bytes = "1"
hex = "0.4"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
pin-project-lite = "0.2"
hyper-util = { version = "0.1.20", features = ["tokio", "http1"] }
keyring = { version = "=3.6.3", features = [
    "linux-native-sync-persistent",
    "crypto-rust",
    "apple-native",
    "windows-native",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-rustls = "0.26"
url = "2"
uuid = { version = "1.20", features = ["v4"] }
webpki-roots = "0.26"
zeroize = "1"

[dev-dependencies]
rcgen = "0.13"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
