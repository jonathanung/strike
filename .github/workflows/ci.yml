name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Full -race suite + soft cover/harness steps need headroom as packages grow.
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Go
        uses: actions/setup-go@0c52d547c9bc32b1aa3301fd7a9cb496313a4491 # v5.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            go.work
            go.work.sum

      - name: Setup Node
        if: hashFiles('web/package.json') != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Workspace modules
        run: |
          set -euo pipefail
          go list -m github.com/jonathanung/strike-cli \
            github.com/jonathanung/strike-cli/pkg/protocol \
            github.com/jonathanung/strike-cli/pkg/redact
          GOWORK=off go list -m github.com/jonathanung/strike-cli \
            github.com/jonathanung/strike-cli/pkg/protocol \
            github.com/jonathanung/strike-cli/pkg/redact

      - name: Generate TUI flatten
        run: go generate ./internal/tui

      - name: GOWORK=off replace build
        run: GOWORK=off go build -o /dev/null ./cmd/strike

      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Not gofmt-formatted; run 'gofmt -w .':"
            echo "$unformatted"
            exit 1
          fi


      - name: Build and test web UI
        if: hashFiles('web/package.json') != ''
        run: make web-check

      - name: Build
        run: go build ./...

      - name: Vet
        run: |
          go vet ./...
          go -C pkg/protocol vet ./...
          go -C pkg/redact vet ./...

      - name: Test
        run: |
          go test -race ./...
          go -C pkg/protocol test -race ./...
          go -C pkg/redact test -race ./...

      # E3.2 prompt regression: verbose report of tool/turn/token deltas.
      # Non-blocking for now (test itself soft-fails metric drift unless
      # PROMPT_REGRESSION_STRICT=1). continue-on-error keeps the step visible
      # if the harness errors while the main Test job stays the hard gate.
      - name: Prompt regression report (soft)
        continue-on-error: true
        run: make prompt-reg

      # #807 harness eval: correctness/safety/recovery/latency-cost report.
      # Scenarios also run hard under Test above. This step is the verbose
      # artifact path (non-blocking first). Path to blocking: remove
      # continue-on-error once the pack is stable on main.
      - name: Harness eval report (soft)
        continue-on-error: true
        run: HARNESS_EVAL_REPORT=$RUNNER_TEMP/harness-eval-report.json make harness-eval

      # Soft coverage report only — do not hard-fail CI on the floor yet.
      # Local gate: make cover-check (COVER_MIN in Makefile).
      - name: Coverage (soft)
        continue-on-error: true
        run: make cover-check

  # Real-browser web smokes (WEBUI.5). Offline echo provider only; does not
  # replace unit tests (make web-check remains the fast default).
  # Note: hashFiles is step-scoped only — do not use it on job-level `if`.
  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Detect web package
        id: web
        run: |
          if [ -f web/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - name: Setup Go
        if: steps.web.outputs.present == 'true'
        uses: actions/setup-go@0c52d547c9bc32b1aa3301fd7a9cb496313a4491 # v5.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            go.work
            go.work.sum

      - name: Setup Node
        if: steps.web.outputs.present == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Generate TUI flatten
        if: steps.web.outputs.present == 'true'
        run: go generate ./internal/tui

      - name: Real-browser web e2e
        if: steps.web.outputs.present == 'true'
        run: make web-e2e

      - name: Upload Playwright artifacts
        if: always() && steps.web.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-e2e-artifacts
          path: web/e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # Darwin-only tests (//go:build darwin) never compile on ubuntu-latest, so a
  # broken libSystem trampoline or wrong-sysctl path ships green (#521, #602).
  # Restrict to packages with _darwin.go — not the full suite — because macOS
  # runners bill at 10× Linux minutes. telemetry is the concentrated risk;
  # wall clock is ~2s of tests so billable cost is mostly runner boot (~1–2 min
  # × 10 ≈ 10–20 macOS-minutes per run).
  test-darwin:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Go
        uses: actions/setup-go@0c52d547c9bc32b1aa3301fd7a9cb496313a4491 # v5.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            go.work
            go.work.sum

      - name: Test darwin-specific packages
        run: go test -race ./internal/telemetry/... ./internal/sandbox/...
