name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Go
        uses: actions/setup-go@0c52d547c9bc32b1aa3301fd7a9cb496313a4491 # v5.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Setup Node
        if: hashFiles('web/package.json') != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Generate TUI flatten
        run: go generate ./internal/tui

      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Not gofmt-formatted; run 'gofmt -w .':"
            echo "$unformatted"
            exit 1
          fi


      - name: Build and test web UI
        if: hashFiles('web/package.json') != ''
        run: make web-check

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # E3.2 prompt regression: verbose report of tool/turn/token deltas.
      # Non-blocking for now (test itself soft-fails metric drift unless
      # PROMPT_REGRESSION_STRICT=1). continue-on-error keeps the step visible
      # if the harness errors while the main Test job stays the hard gate.
      - name: Prompt regression report (soft)
        continue-on-error: true
        run: make prompt-reg

      # Soft coverage report only — do not hard-fail CI on the floor yet.
      # Local gate: make cover-check (COVER_MIN in Makefile).
      - name: Coverage (soft)
        continue-on-error: true
        run: make cover-check

  # Darwin-only tests (//go:build darwin) never compile on ubuntu-latest, so a
  # broken libSystem trampoline or wrong-sysctl path ships green (#521, #602).
  # Restrict to packages with _darwin.go — not the full suite — because macOS
  # runners bill at 10× Linux minutes. telemetry is the concentrated risk;
  # wall clock is ~2s of tests so billable cost is mostly runner boot (~1–2 min
  # × 10 ≈ 10–20 macOS-minutes per run).
  test-darwin:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Go
        uses: actions/setup-go@0c52d547c9bc32b1aa3301fd7a9cb496313a4491 # v5.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test darwin-specific packages
        run: go test -race ./internal/telemetry/...
