name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Full -race suite + soft cover/harness steps need headroom as packages grow.
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Go
        uses: actions/setup-go@0c52d547c9bc32b1aa3301fd7a9cb496313a4491 # v5.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            go.work
            go.work.sum

      - name: Setup Node
        if: hashFiles('web/package.json') != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Workspace modules
        run: |
          set -euo pipefail
          go list -m github.com/jonathanung/strike \
            github.com/jonathanung/strike/pkg/protocol \
            github.com/jonathanung/strike/pkg/redact \
            github.com/jonathanung/strike/harness
          GOWORK=off go list -m github.com/jonathanung/strike \
            github.com/jonathanung/strike/pkg/protocol \
            github.com/jonathanung/strike/pkg/redact \
            github.com/jonathanung/strike/harness

      - name: Generate TUI flatten
        run: go generate ./internal/frontend/tui

      - name: GOWORK=off replace build
        run: GOWORK=off go build -o /dev/null ./cmd/strike

      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Not gofmt-formatted; run 'gofmt -w .':"
            echo "$unformatted"
            exit 1
          fi


      - name: Build and test web UI
        if: hashFiles('web/package.json') != ''
        run: make web-check

      - name: Build
        run: go build ./...

      - name: Vet
        run: |
          go vet ./...
          go -C pkg/protocol vet ./...
          go -C pkg/redact vet ./...
          go -C harness vet ./...

      - name: Test
        run: |
          go test -race ./...
          go -C pkg/protocol test -race ./...
          go -C pkg/redact test -race ./...
          go -C harness test -race ./...

      # Generated protocol Rust types (#1306). Go drift already ran above
      # (`go -C pkg/protocol test`). This job checks the golden event stream
      # decodes, including an unknown event type.
      - name: Protocol schema Rust tests
        run: |
          set -euo pipefail
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.83.0
            . "$HOME/.cargo/env"
          fi
          cargo test --manifest-path webui/protocol-schema/Cargo.toml --locked

      # E3.2 prompt regression: verbose report of tool/turn/token deltas.
      # Non-blocking for now (test itself soft-fails metric drift unless
      # PROMPT_REGRESSION_STRICT=1). continue-on-error keeps the step visible
      # if the harness errors while the main Test job stays the hard gate.
      - name: Prompt regression report (soft)
        continue-on-error: true
        run: make prompt-reg

      # #807 harness eval: correctness/safety/recovery/latency-cost report.
      # Scenarios also run hard under Test above. This step is the verbose
      # artifact path (non-blocking first). Path to blocking: remove
      # continue-on-error once the pack is stable on main.
      - name: Harness eval report (soft)
        continue-on-error: true
        run: HARNESS_EVAL_REPORT=$RUNNER_TEMP/harness-eval-report.json make harness-eval

      # Soft coverage report only — do not hard-fail CI on the floor yet.
      # Local gate: make cover-check (COVER_MIN in Makefile).
      - name: Coverage (soft)
        continue-on-error: true
        run: make cover-check

  # Real-browser web smokes (WEBUI.5). Offline echo provider only; does not
  # replace unit tests (make web-check remains the fast default).
  # Note: hashFiles is step-scoped only — do not use it on job-level `if`.
  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Detect web package
        id: web
        run: |
          if [ -f web/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - name: Setup Go
        if: steps.web.outputs.present == 'true'
        uses: actions/setup-go@0c52d547c9bc32b1aa3301fd7a9cb496313a4491 # v5.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            go.work
            go.work.sum

      - name: Setup Node
        if: steps.web.outputs.present == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Generate TUI flatten
        if: steps.web.outputs.present == 'true'
        run: go generate ./internal/frontend/tui

      - name: Real-browser web e2e
        if: steps.web.outputs.present == 'true'
        run: make web-e2e

      - name: Upload Playwright artifacts
        if: always() && steps.web.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-e2e-artifacts
          path: web/e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # Rust cockpit smoke. web-e2e skips when web/package.json is absent, so
  # nothing else loads the embedded Leptos UI. Uses the committed static
  # bundle (no Rust toolchain) plus headless Chrome.
  webui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Go
        uses: actions/setup-go@0c52d547c9bc32b1aa3301fd7a9cb496313a4491 # v5.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            go.work
            go.work.sum

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install Chrome
        run: |
          # ubuntu-latest already ships a `google-chrome` shim. The smoke job
          # used to skip this install when that name was on PATH, then Chrome
          # never opened a DevTools port (run 40258392740). Always install the
          # official stable deb and invoke that binary.
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/chrome.deb
          command -v google-chrome-stable
          google-chrome-stable --version

      - name: Generate TUI flatten
        run: go generate ./internal/frontend/tui/app

      - name: Build strike
        run: go build -o strike ./cmd/strike

      - name: Boot cockpit and check auth
        env:
          CHROME_BIN: /usr/bin/google-chrome-stable
        run: node scripts/webui-smoke.mjs

      - name: Browser UAT assertions
        env:
          CHROME_BIN: /usr/bin/google-chrome-stable
        run: |
          node --test scripts/webui-uat/*.test.mjs
          node scripts/webui-uat.mjs --suite smoke --no-video --out webui-uat-artifacts

      - name: Upload UAT screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: webui-uat
          path: webui-uat-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # Rust desktop shell. Tests the loopback gateway manager only.
  # The Tauri package (desktop/app) needs WebKitGTK and is not built here.
  # See docs/desktop.md.
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.90.0"
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31
        with:
          workspaces: desktop

      - name: Test desktop gateway manager
        run: |
          cargo fmt --manifest-path desktop/Cargo.toml --check
          cargo test --locked --manifest-path desktop/Cargo.toml -p strike-desktop-core -p strike-desktop

  # Darwin-only tests (//go:build darwin) never compile on ubuntu-latest, so a
  # broken libSystem trampoline or wrong-sysctl path ships green (#521, #602).
  # Restrict to packages with _darwin.go — not the full suite — because macOS
  # runners bill at 10× Linux minutes. telemetry is the concentrated risk;
  # wall clock is ~2s of tests so billable cost is mostly runner boot (~1–2 min
  # × 10 ≈ 10–20 macOS-minutes per run).
  test-darwin:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Go
        uses: actions/setup-go@0c52d547c9bc32b1aa3301fd7a9cb496313a4491 # v5.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            go.work
            go.work.sum

      - name: Test darwin-specific packages
        run: |
          go test -race ./internal/persist/telemetry/...
          go -C harness test -race ./sandbox/...
