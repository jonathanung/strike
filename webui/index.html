</script>

<body>
<!-- Boot shell: shown until the cockpit mounts (main.rs removes it on
     mount). If the gateway is unreachable and only the cached shell
     loads, this is the honest state the user sees instead of a blank
     page: shell only, no app data. Styled by .boot-shell in style.css
     (the server CSP blocks inline styles). -->
<div class="boot-shell">
  <div class="boot-shell-card">
    <p class="boot-shell-title">Strike</p>
    <p class="boot-shell-note">Loading the cockpit shell… If this stays here, the gateway may be unreachable. Check that the gateway is running, then reload.</p>
  </div>
</div>
