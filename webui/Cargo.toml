[package]
name = "strike-webui"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
gloo-net = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["DataTransfer", "DragEvent", "Event", "EventSource", "KeyboardEvent", "Location", "MessageEvent", "MouseEvent", "Storage", "SubmitEvent", "Window"] }

[profile.release]
opt-level = 2
