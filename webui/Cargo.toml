[package]
name = "strike-webui"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.8.22", features = ["csr"] }
gloo-net = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
protocol-schema = { path = "protocol-schema" }
load-guard = { path = "load-guard" }
md-review = { path = "md-review" }
status-card = { path = "status-card" }
composer-drafts = { path = "composer-drafts" }
signin-flow = { path = "signin-flow" }
transcript-window = { path = "transcript-window" }
quote-message = { path = "quote-message" }
theme-catalog = { path = "theme-catalog" }
js-sys = "0.3"
send_wrapper = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
web-sys = { version = "0.3", features = ["AbortController", "AbortSignal", "BeforeUnloadEvent", "Blob", "BlobPropertyBag", "CanvasRenderingContext2d", "Clipboard", "ClipboardEvent", "CloseEvent", "CssStyleDeclaration", "CustomEvent", "CustomEventInit", "DataTransfer", "Document", "DomRect", "DomRectReadOnly", "DragEvent", "Element", "Event", "EventSource", "EventTarget", "File", "FileList", "FileReader", "History", "HtmlAnchorElement", "HtmlButtonElement", "HtmlCanvasElement", "HtmlElement", "HtmlHeadElement", "HtmlImageElement", "HtmlInputElement", "HtmlTextAreaElement", "HtmlVideoElement", "KeyboardEvent", "Location", "MediaDevices", "MediaQueryList", "MediaStream", "MediaStreamConstraints", "MediaStreamTrack", "MessageEvent", "MouseEvent", "Navigator", "Node", "NodeList", "Notification", "NotificationOptions", "NotificationPermission", "PointerEvent", "RequestCredentials", "ResizeObserver", "ResizeObserverEntry", "Selection", "ServiceWorker", "ServiceWorkerContainer", "Storage", "SubmitEvent", "Touch", "TouchEvent", "TouchList", "Url", "VisualViewport", "WebSocket", "Window"] }

[profile.release]
opt-level = 2
