[package]
name = "strike-webui"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
gloo-net = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
protocol-schema = { path = "protocol-schema" }
js-sys = "0.3"
send_wrapper = "0.6"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Blob", "ClipboardEvent", "CssStyleDeclaration", "DataTransfer", "Document", "DomRect", "DomRectReadOnly", "DragEvent", "Element", "Event", "EventSource", "EventTarget", "File", "FileList", "FileReader", "HtmlButtonElement", "HtmlElement", "HtmlHeadElement", "HtmlInputElement", "HtmlTextAreaElement", "KeyboardEvent", "Location", "MessageEvent", "MouseEvent", "Navigator", "Node", "Notification", "NotificationOptions", "NotificationPermission", "ServiceWorker", "ServiceWorkerContainer", "Storage", "SubmitEvent", "Url", "BlobPropertyBag", "CustomEvent", "CustomEventInit", "HtmlAnchorElement", "Clipboard", "Window"] }

[profile.release]
opt-level = 2
